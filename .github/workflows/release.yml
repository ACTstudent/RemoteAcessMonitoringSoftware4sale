name: Build & Release Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Determine and verify release version
        id: version
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tag '$tag' must have the form v2.8.0."
          }
          $version = $tag.Substring(1)
          $metadataVersion = [string](Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json).version
          if ($metadataVersion -ne $version) {
            throw "Release tag version $version does not match version.json $metadataVersion."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Run canonical build and installer validation
        shell: powershell
        run: .\build-everything.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CAMS ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            server-dist/CAMS-Server-Setup.exe
            server-dist/CAMS-Server-Setup.exe.sha256
            server-dist/release-manifest.json
            client-dist/CAMS-Client-Setup.exe
            client-dist/CAMS-Client-Setup.exe.sha256
