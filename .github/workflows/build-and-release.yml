name: Build & Release CAMS Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup 6
        run: |
          # Inno Setup is pre-installed on windows-latest, but let's verify
          $isccPath = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            "C:\Program Files\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isccPath) {
            Write-Host "Inno Setup not found, installing via Chocolatey..."
            choco install innosetup -y --version 6.2.2 --no-progress
            $isccPath = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $isccPath) {
            Write-Host "ERROR: Inno Setup ISCC.exe not found after install"
            exit 1
          }
          Write-Host "Found ISCC at: $isccPath"
          echo "ISCC_PATH=$isccPath" >> $GITHUB_ENV

      - name: Build solution
        run: |
          cd "Monitoring And Remote Access"
          dotnet build RemoteMonitoring.sln -c Release -v q

      - name: Publish server
        run: |
          cd "Monitoring And Remote Access"
          dotnet publish Server/Server.csproj -c Release -o ../../server-publish -v q

      - name: Publish client (self-contained, single-file)
        run: |
          cd "Monitoring And Remote Access"
          dotnet publish Client/Client.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true `
            -o ../../client-publish -v q

      - name: Build installers with Inno Setup
        run: |
          New-Item -ItemType Directory -Force -Path server-dist, client-dist | Out-Null
          $iscc = $env:ISCC_PATH
          & $iscc "/oserver-dist" "server-installer.iss"
          & $iscc "/oclient-dist" "client-installer.iss"

      - name: Unblock installers
        run: |
          Get-ChildItem -Path server-dist, client-dist -Recurse -Include *.exe | ForEach-Object { Unblock-File $_.FullName -ErrorAction SilentlyContinue }

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server-dist/CAMS-Server-Setup.exe
            client-dist/CAMS-Client-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}