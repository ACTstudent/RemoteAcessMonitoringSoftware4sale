name: Build & Release CAMS Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ISCC_PATH: "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify/Install Inno Setup
        run: |
          if (-not (Test-Path $env:ISCC_PATH)) {
            $alt = "C:\Program Files\Inno Setup 6\ISCC.exe"
            if (Test-Path $alt) {
              echo "ISCC_PATH=$alt" >> $GITHUB_ENV
            } else {
              Write-Host "Installing Inno Setup via Chocolatey..."
              choco install innosetup -y --version 6.2.2 --no-progress
              if (Test-Path $env:ISCC_PATH) {
                # already set
              } elseif (Test-Path $alt) {
                echo "ISCC_PATH=$alt" >> $GITHUB_ENV
              } else {
                Write-Host "ERROR: ISCC.exe not found"
                exit 1
              }
            }
          }
          Write-Host "Using ISCC: $env:ISCC_PATH"

      - name: Build solution
        run: |
          cd "Monitoring And Remote Access"
          dotnet build RemoteMonitoring.sln -c Release -v q

      - name: Publish server
        run: |
          cd "Monitoring And Remote Access"
          dotnet publish Server/Server.csproj -c Release -o ../../server-publish -v q

      - name: Publish client (self-contained, single-file)
        run: |
          cd "Monitoring And Remote Access"
          dotnet publish Client/Client.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true `
            -o ../../client-publish -v q

      - name: Build installers with Inno Setup
        run: |
          $iscc = $env:ISCC_PATH
          $root = $PSScriptRoot
          $serverDist = Join-Path $root "server-dist"
          $clientDist = Join-Path $root "client-dist"
          New-Item -ItemType Directory -Force -Path $serverDist, $clientDist | Out-Null
          Write-Host "Building server installer..."
          & $iscc "/o$serverDist" (Join-Path $root "server-installer.iss")
          Write-Host "Building client installer..."
          & $iscc "/o$clientDist" (Join-Path $root "client-installer.iss")

      - name: Verify outputs
        run: |
          ls server-dist/
          ls client-dist/

      - name: Unblock installers
        run: |
          Get-ChildItem -Path server-dist, client-dist -Recurse -Include *.exe | ForEach-Object { Unblock-File $_.FullName -ErrorAction SilentlyContinue }

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server-dist/CAMS-Server-Setup.exe
            client-dist/CAMS-Client-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}