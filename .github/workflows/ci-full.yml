name: Full Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Run xUnit tests
        run: dotnet test "Monitoring And Remote Access\Server.Tests\Server.Tests.csproj" -c Release --verbosity minimal

      - name: Build solution
        run: dotnet build "Monitoring And Remote Access\RemoteMonitoring.sln" -c Release

      - name: Publish server
        run: dotnet publish "Monitoring And Remote Access\Server\Server.csproj" -c Release -o server-publish

      - name: Publish client (self-contained, single-file)
        run: dotnet publish "Monitoring And Remote Access\Client\Client.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o client-publish

      - name: Find Inno Setup
        id: iscc
        run: |
          $paths = @(
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Found ISCC at: $p"
              "path=$p" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              exit 0
            }
          }
          Write-Host "Searching entire drive..."
          $found = Get-ChildItem -Path C:\ -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            Write-Host "Found ISCC at: $($found.FullName)"
            "path=$($found.FullName)" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          } else {
            Write-Error "ISCC.exe not found anywhere"
            exit 1
          }

      - name: Build server installer
        run: |
          $iscc = "${{ steps.iscc.outputs.path }}"
          Write-Host "Running: $iscc /O:server-dist server-installer.iss"
          $output = & cmd /c "`"$iscc`" /O:server-dist server-installer.iss 2>&1"
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Build client installer
        run: |
          $iscc = "${{ steps.iscc.outputs.path }}"
          Write-Host "Running: $iscc /O:client-dist client-installer.iss"
          $output = & cmd /c "`"$iscc`" /O:client-dist client-installer.iss 2>&1"
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

