name: Full Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Run canonical build and installer validation
        shell: powershell
        run: .\build-everything.ps1

      - name: Upload validated installers
        uses: actions/upload-artifact@v4
        with:
          name: cams-installers
          if-no-files-found: error
          path: |
            server-dist/CAMS-Server-Setup.exe
            server-dist/CAMS-Server-Setup.exe.sha256
            server-dist/release-manifest.json
            client-dist/CAMS-Client-Setup.exe
            client-dist/CAMS-Client-Setup.exe.sha256
