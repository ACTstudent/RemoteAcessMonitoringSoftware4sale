<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CAMS">
  <!-- The brand square, in --sidebar-bg. Drawn rather than scaled from the
       school logo: that file is 825 KB, which is not a favicon. -->
  <rect width="64" height="64" rx="14" fill="#16401F"/>
  <!-- A workstation, which is what the product watches. -->
  <rect x="14" y="18" width="36" height="24" rx="3" fill="none" stroke="#BBF3C6" stroke-width="4"/>
  <path d="M26 48h12" stroke="#BBF3C6" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 42v6" stroke="#BBF3C6" stroke-width="4" stroke-linecap="round"/>
  <!-- The monitoring indicator. -->
  <circle cx="32" cy="30" r="4.5" fill="#17803A"/>
</svg>
